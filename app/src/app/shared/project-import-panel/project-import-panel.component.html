<section class="import-panel" aria-label="Importar projeto e filtrar feed">
  <div class="panel-head">
    <div>
      <span>Workspace</span>
      <h1>Adicionar projeto ao portfólio</h1>
    </div>
    <button class="ghost-action" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 5v14M5 12h14" />
      </svg>
      <span>Novo</span>
    </button>
  </div>

  <div class="source-bar">
    <label class="source-input" aria-label="URL do projeto">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1" />
        <path d="M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1" />
      </svg>
      <input type="url" placeholder="URL do repositório ou deploy" />
    </label>
    <button class="source-action" type="button">Importar</button>
  </div>

  <div class="import-grid">
    <label class="upload-zone">
      <input type="file" accept=".zip,.rar,.7z,.tar,.gz" />
      <span class="zone-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 16V4m0 0 4 4m-4-4-4 4" />
          <path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" />
        </svg>
      </span>
      <span>
        <strong>Upload do projeto</strong>
        <small>ZIP, RAR ou TAR</small>
      </span>
    </label>

    <button class="setup-card" type="button">
      <span class="zone-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5v-11Z" />
          <path d="M8 9h8M8 13h5M8 17h7" />
        </svg>
      </span>
      <span>
        <strong>Configurar página</strong>
        <small>Logo, banner, navegação e deploy</small>
      </span>
    </button>
  </div>

</section>
